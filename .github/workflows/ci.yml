name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            archipelago/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build The Archipelago (the new portfolio) into dist/archipelago
        working-directory: archipelago
        run: |
          npm ci
          SITE_BASE=/archipelago/ SITE_URL=https://www.thesumanth.com/archipelago/ npm run build
