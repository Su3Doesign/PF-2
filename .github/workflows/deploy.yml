name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            archipelago/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build The Archipelago (the new portfolio) into dist/archipelago
        working-directory: archipelago
        run: |
          npm ci
          SITE_BASE=/archipelago/ SITE_URL=https://www.thesumanth.com/archipelago/ npm run build
      - run: cp -r archipelago/dist dist/archipelago
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
