<body class="page" data-page="contact">

<div class="survey" aria-hidden="true"></div>
<div class="hud">
  <a class="wordmark" href="../">SUMANTH</a>
  <div class="top-right" style="right: var(--inset)">
    <a class="mono" href="../">The voyage</a>
    <a class="mono" href="../work/">Work</a>
    <a class="mono" href="../about/">About</a>
    <a class="mono" href="../contact/" aria-current="page">Contact</a>
  </div>
</div>
<div class="cursor" id="cursor" aria-hidden="true"><span class="ring"></span><span class="dot"></span><span class="lbl"></span></div>
<main>
  <p class="mono kick">End of the map</p>
  <h1 class="mega" style="font-size:clamp(56px,10vw,170px)">Let's chart<br/>the next one.</h1>
  <section class="contact">
    <div>
      <a class="big" href="mailto:hello@thesumanth.com" id="mail">hello@thesumanth.com</a>
      <p class="mono" style="margin-top:14px;color:var(--bone-500)">Click copies it too.</p>
      <ul class="toolbelt" style="margin-top:30px"><li><a href="https://www.behance.net/sumanthrichie" target="_blank" rel="noopener">Behance ↗</a></li><li><a href="https://github.com/Su3Doesign" target="_blank" rel="noopener">GitHub ↗</a></li><li><a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram ↗</a></li><li><a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn ↗</a></li></ul>
    </div>
    <form id="brief" novalidate>
      <div><p class="mono" style="color:var(--gold);margin:0 0 10px">I'd like</p><div class="pills" role="group" aria-label="Project type"><button type="button" aria-pressed="true">A brand</button><button type="button" aria-pressed="false">A 3D world</button><button type="button" aria-pressed="false">A website</button><button type="button" aria-pressed="false">Something else</button></div></div>
      <label>Your name<input name="name" autocomplete="name" required /></label>
      <label>Your email<input name="email" type="email" autocomplete="email" required /></label>
      <label>Budget<select name="budget"><option>Not sure yet</option><option>Under ₹1L</option><option>₹1L – ₹5L</option><option>₹5L+</option><option>USD, let's talk</option></select></label>
      <label>The idea<textarea name="msg" rows="5" required></textarea></label>
      <div><button class="btn" type="submit">Send the signal</button></div>
      <p class="mono" id="formNote" style="color:var(--bone-500)" aria-live="polite"></p>
    </form>
  </section>
</main>
